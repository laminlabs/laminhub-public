name: status-exporter

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/status-exporter.yml"
      - "status/exporter/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/status-exporter.yml"
      - "status/exporter/**"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade uv
      - run: uv pip install --system -e "status/exporter[dev]"
      - run: ruff check status/exporter
      - run: ruff format --check status/exporter
      - run: pytest status/exporter/tests
